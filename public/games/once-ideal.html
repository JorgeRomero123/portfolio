<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Once Ideal</title>
<style>
:root {
  --bg: #0a0b0d; --panel: #111316; --panel2: #171a1e; --line: #262a31; --line2: #343943;
  --tx: #e8e9ec; --mut: #969ba5; --dim: #666c77;
  --atk: #d9a85c; --def: #73a7e3; --tac: #b7a0dc; --sys: #68b98f; --bad: #de6f61; --good: #68b98f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); }
body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; }
button:focus-visible { outline: 2px solid var(--def); outline-offset: 2px; }
b, .num { font-variant-numeric: tabular-nums; }
kbd { font: 11px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--mut); border: 1px solid var(--line2); border-radius: 4px; padding: 2px 5px; margin-left: 6px; background: var(--bg); }
h1, h2, h3, h4, p { margin: 0; }
.muted { color: var(--mut); } .dim { color: var(--dim); } .good { color: var(--good); } .bad { color: var(--bad); }
#app { height: 100%; display: flex; flex-direction: column; }

/* barra superior */
.top { flex: 0 0 46px; display: flex; align-items: center; gap: 18px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.brand { font-weight: 650; letter-spacing: .02em; }
.stat { color: var(--mut); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.stat b { color: var(--tx); font-weight: 600; }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 6px; height: 12px; border-radius: 1px; background: var(--line2); }
.pips i.on { background: var(--good); } .pips.low i.on { background: var(--bad); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line2); border-radius: 7px; padding: 6px 12px; font-size: 13px; background: var(--panel2); color: var(--tx); display: inline-flex; align-items: center; }
.btn:hover:not(:disabled) { border-color: #4a505c; background: #1c2025; }
.btn:disabled { opacity: .4; }
.btn.primary { background: var(--tx); color: #0b0c0e; border-color: var(--tx); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #fff; }
.btn.primary kbd { background: transparent; color: #444; border-color: #9a9da3; }
.btn.big { padding: 10px 18px; font-size: 14px; }
.btn.danger { border-color: #5a2f2a; color: var(--bad); }

/* pantallas generales */
.screen { flex: 1; min-height: 0; overflow: auto; padding: 22px 24px 28px; }
.wrap { max-width: 1080px; margin: 0 auto; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); margin-bottom: 6px; }
.title { font-size: 26px; font-weight: 650; letter-spacing: -.01em; }
.sub { color: var(--mut); margin-top: 6px; max-width: 720px; }
.row { display: flex; gap: 14px; flex-wrap: wrap; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.panel h4 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); font-weight: 600; margin-bottom: 8px; }
.opt { flex: 1 1 240px; display: flex; flex-direction: column; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-height: 120px; }
button.opt:hover:not(:disabled) { border-color: #59606c; background: var(--panel2); }
button.opt:disabled { opacity: .45; }
.opt .on { font-size: 16px; font-weight: 620; }
.opt .od { color: var(--mut); font-size: 13px; }
.opt .of { margin-top: auto; color: var(--dim); font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; margin-top: 18px; }
table.cal { width: 100%; border-collapse: collapse; font-size: 13px; }
table.cal td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
table.cal tr:last-child td { border-bottom: 0; }
table.cal tr.cur td { color: var(--tx); font-weight: 600; background: var(--panel2); }
table.cal td.r { text-align: right; font-variant-numeric: tabular-nums; }
table.cal { color: var(--mut); }
.res { display: inline-block; min-width: 20px; text-align: center; border-radius: 4px; font-size: 11px; font-weight: 700; padding: 1px 5px; border: 1px solid var(--line2); }
.res.W { color: var(--good); border-color: #2f5a45; } .res.L { color: var(--bad); border-color: #5a2f2a; } .res.D { color: var(--mut); }
ul.plain { list-style: none; margin: 0; padding: 0; } ul.plain li { padding: 3px 0; color: var(--mut); font-size: 13px; }
ul.plain li b { color: var(--tx); font-weight: 600; }
.bigscore { font-size: 54px; font-weight: 680; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
.kv { display: flex; gap: 28px; margin-top: 14px; flex-wrap: wrap; }
.kv div { font-size: 13px; color: var(--mut); } .kv b { display: block; font-size: 20px; color: var(--tx); font-weight: 620; }
.glosslist { font-size: 12.5px; color: var(--mut); line-height: 1.4; }
.glosslist p { margin: 0 0 6px; } .glosslist b { color: var(--tx); font-weight: 600; }

/* cartas */
.card { position: relative; flex: 0 0 auto; width: 150px; height: 256px; background: #15171b; border: 1px solid #2d3139; border-radius: 10px; padding: 10px 10px 9px; display: flex; flex-direction: column; text-align: left; overflow: hidden; transition: transform .09s ease, border-color .09s ease; }
.card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--dim); }
.card.tA::before { background: var(--atk); } .card.tD::before { background: var(--def); } .card.tT::before { background: var(--tac); } .card.tS::before { background: var(--sys); } .card.tX::before { background: var(--bad); }
.card .chead { display: flex; align-items: center; gap: 7px; margin-top: 2px; }
.card .cost { flex: 0 0 24px; height: 24px; border-radius: 50%; border: 1px solid #4a505c; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; background: var(--bg); }
.card .ctype { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); flex: 1; }
.card.tA .ctype { color: var(--atk); } .card.tD .ctype { color: var(--def); } .card.tT .ctype { color: var(--tac); } .card.tS .ctype { color: var(--sys); } .card.tX .ctype { color: var(--bad); }
.card .ckey { font: 10px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--dim); border: 1px solid var(--line2); border-radius: 4px; padding: 2px 4px; }
.card .cn { font-weight: 640; font-size: 14px; line-height: 1.2; margin-top: 8px; }
.card .cart { display: block; flex: 0 0 auto; width: calc(100% + 20px); height: 52px; margin: 8px -10px 0; }
.card.dis .cart, .card.sold .cart { filter: grayscale(1); }
.card.up .cn { color: var(--good); }
.card .cx { font-size: 12.5px; line-height: 1.36; color: #c9ccd2; margin-top: 7px; flex: 1; overflow: hidden; }
.card .cf { font-size: 10.5px; color: var(--dim); display: flex; justify-content: space-between; gap: 6px; margin-top: 4px; white-space: nowrap; }
button.card:hover:not(:disabled), button.card:focus-visible { transform: translateY(-8px); border-color: #6a7180; z-index: 5; }
.card.dis { opacity: .42; }
.card.sold { opacity: .25; }
.card.lg { width: 178px; height: 296px; } .card.lg .cart { height: 62px; } .card.lg .cn { font-size: 15.5px; } .card.lg .cx { font-size: 13.5px; }
.cards { display: flex; flex-wrap: wrap; gap: 12px; }
.slot { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.price { font-size: 12.5px; color: var(--mut); text-align: center; } .price b { color: var(--tx); }

/* partido */
.match { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 276px; gap: 12px; padding: 10px 12px 10px; }
.pitch { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 9px; overflow-y: auto; overflow-x: hidden; }
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 8px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.score .tm { font-size: 17px; font-weight: 620; } .score .tm small { display: block; font-size: 11.5px; color: var(--mut); font-weight: 400; }
.score .tm.rv { text-align: right; }
.score .sc { text-align: center; } .score .sc b { font-size: 30px; font-weight: 680; letter-spacing: .02em; line-height: 1; }
.score .sc small { display: block; font-size: 11.5px; color: var(--mut); margin-top: 3px; }
.turns { display: inline-flex; gap: 3px; margin-right: 6px; vertical-align: middle; } .turns i { width: 12px; height: 4px; border-radius: 2px; background: var(--line2); } .turns i.on { background: var(--tx); }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.meter { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px 10px; }
.meter .mh { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--mut); letter-spacing: .06em; text-transform: uppercase; }
.meter .mh b { font-size: 18px; color: var(--tx); letter-spacing: 0; }
.bar { position: relative; height: 10px; border-radius: 5px; background: #1d2026; margin: 7px 0 6px; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px 0 0 5px; }
.meter.atk .bar i { background: var(--atk); } .meter.dng .bar i { background: var(--bad); }
.bar em { position: absolute; top: 0; bottom: 0; background: rgba(222, 111, 97, .36); }
.meter .ms { font-size: 12.5px; color: var(--mut); }
.intent { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: 10px; padding: 9px 14px; }
.intent.calm { border-left-color: var(--line2); }
.lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
.intent .itx { font-size: 16px; font-weight: 620; margin-top: 3px; line-height: 1.25; }
.intent .fc { font-size: 13px; color: var(--mut); border-left: 1px solid var(--line); padding-left: 18px; } .intent .fc b { color: var(--tx); font-weight: 600; }
.intent .fc .bad { font-weight: 600; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; min-width: 0; }
.status .lbl { margin-right: 4px; } .status .lbl.sep { margin-left: 12px; padding-left: 16px; border-left: 1px solid var(--line2); }
.chip { font-size: 12px; border: 1px solid var(--line2); border-radius: 6px; padding: 2px 7px; color: #c9ccd2; background: var(--panel2); white-space: nowrap; }
.chip.none { border-style: dashed; color: var(--dim); background: none; }
.hintbar { display: flex; gap: 12px; align-items: center; border: 1px solid #3a4a5e; background: #10161d; border-radius: 10px; padding: 7px 12px; font-size: 13px; color: #cfd8e3; }
.hintbar span { flex: 1; }
.controls { display: flex; align-items: center; gap: 10px; }
.energy { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mut); border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 12px; }
.energy b { font-size: 18px; color: var(--tx); }
.orbs { display: inline-flex; gap: 3px; } .orbs i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--line2); } .orbs i.on { background: var(--tx); border-color: var(--tx); }
.hand { flex: 1; min-height: 264px; display: flex; justify-content: center; align-items: flex-end; padding: 10px 0 2px; }
.hand .card { margin-left: 8px; } .hand .card:first-child { margin-left: 0; }
.hand .empty { color: var(--dim); align-self: center; }
.side { min-height: 0; display: flex; flex-direction: column; gap: 9px; }
.side .panel { padding: 11px 13px; min-height: 0; overflow: auto; }
.side .gl { flex: 1 1 55%; } .side .lg { flex: 1 1 45%; }
.logl { font-size: 12px; color: var(--mut); line-height: 1.4; } .logl p { margin: 0 0 4px; } .logl p:first-child { color: var(--tx); }

/* modales y avisos */
.modal { position: fixed; inset: 0; background: rgba(5, 6, 8, .78); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
.sheet { background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; width: min(980px, 100%); max-height: 100%; display: flex; flex-direction: column; }
.sheet.sm { width: min(440px, 100%); }
.sheet .sh { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.sheet .sh h3 { font-size: 16px; font-weight: 640; }
.sheet .sb { padding: 16px 18px 20px; overflow: auto; }
.rules h4 { font-size: 13px; font-weight: 640; margin: 16px 0 5px; color: var(--tx); letter-spacing: 0; text-transform: none; }
.rules h4:first-child { margin-top: 0; }
.rules p, .rules li { color: #c3c6cc; font-size: 13.5px; line-height: 1.5; }
.rules p { margin-bottom: 6px; } .rules ul { margin: 0 0 6px; padding-left: 18px; }
.rules .cols { columns: 2; column-gap: 28px; } .rules .cols > div { break-inside: avoid; }
#toasts { position: fixed; top: 56px; right: 12px; width: 276px; display: flex; flex-direction: column; align-items: stretch; gap: 6px; pointer-events: none; z-index: 40; }
.toast { background: #1d2127; box-shadow: 0 6px 20px rgba(0,0,0,.5); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 14px; font-size: 13px; color: var(--tx); animation: tin .18s ease-out, tout .4s ease-in 3.4s forwards; }
.toast.goal { border-color: var(--good); color: var(--good); font-weight: 700; font-size: 17px; padding: 10px 14px; letter-spacing: .03em; }
.toast.concede { border-color: var(--bad); color: var(--bad); font-weight: 700; font-size: 17px; padding: 10px 14px; letter-spacing: .03em; }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes tout { to { opacity: 0; } }
.foot { color: var(--dim); font-size: 12px; margin-top: 22px; }
@media (max-height: 720px) {
  .card { height: 236px; } .card .cart { height: 44px; margin-top: 6px; } .hand { min-height: 244px; } .score { padding: 5px 16px; } .meter { padding: 7px 14px 8px; }
}
@media (max-height: 660px) {
  .card { height: 204px; } .card .cart { height: 32px; margin-top: 4px; } .card .cx { font-size: 12px; line-height: 1.3; margin-top: 5px; } .hand { min-height: 212px; } .card .cn { margin-top: 6px; } .meter .ms { display: none; } .top { flex-basis: 40px; }
}
@media (min-height: 840px) and (min-width: 1400px) {
  .hand .card { width: 166px; height: 288px; padding: 12px 12px 10px; } .hand .card .cart { height: 58px; width: calc(100% + 24px); margin: 9px -12px 0; } .hand .card .cn { font-size: 15px; } .hand .card .cx { font-size: 13.5px; }
  .hand { min-height: 300px; }
}

.top { background: rgba(10, 11, 13, .86); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.panel, .opt, .score, .meter, .intent, .status, .energy, .hintbar { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.sheet { background: #111316; }
.card { box-shadow: 0 8px 22px rgba(0, 0, 0, .45); }
.crest { object-fit: contain; flex: 0 0 auto; }
.crest.xs { width: 18px; height: 18px; vertical-align: -4px; margin-right: 7px; }
.crest.md { width: 40px; height: 40px; }
.crest.lg { width: 84px; height: 84px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .6)); }
.crest.hero { display: block; width: 74px; height: 74px; margin-bottom: 14px; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, .6)); }
.brand { display: flex; align-items: center; }
.score .tm { display: flex; align-items: center; gap: 12px; }
.score .tm.rv { justify-content: flex-end; text-align: right; }
.versus { display: flex; align-items: center; gap: 22px; margin: 6px 0 4px; }
.versus .title { margin: 0; }
.bigscore { display: flex; align-items: center; gap: 14px; }
.bigscore .crest.md { width: 52px; height: 52px; }
@media (max-height: 720px) { .crest.md { width: 32px; height: 32px; } .crest.lg { width: 64px; height: 64px; } .crest.hero { width: 56px; height: 56px; } }
#app.sc-vestidor .wrap, #app.sc-estadio .wrap { background: rgba(10, 11, 13, .8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; padding: 24px 28px 26px; box-shadow: 0 18px 50px rgba(0, 0, 0, .5); }
#app.sc-vestidor .wrap .panel, #app.sc-estadio .wrap .panel, #app.sc-vestidor .wrap .opt, #app.sc-estadio .wrap .opt { background: rgba(24, 27, 32, .7); backdrop-filter: none; -webkit-backdrop-filter: none; }

/* ---------- animación de gol ---------- */
.goalfx { position: fixed; inset: 0; z-index: 80; pointer-events: none; display: flex; align-items: center; justify-content: center; overflow: hidden; animation: gin .25s ease-out; }
.goalfx.mine { background: radial-gradient(circle at 50% 50%, rgba(22, 40, 102, .98), rgba(5, 8, 20, .99) 72%); }
.goalfx.theirs { background: radial-gradient(circle at 50% 50%, rgba(96, 26, 22, .97), rgba(12, 4, 4, .99) 72%); animation: gin .2s ease-out, gshake .45s ease-in-out .15s; }
.goalfx.out { opacity: 0; transition: opacity .45s ease-in; }
.gflash { position: absolute; inset: 0; background: #fff; opacity: 0; animation: gflash .5s ease-out; }
.goalfx.theirs .gflash { background: #de6f61; }
.grings { position: absolute; left: 50%; top: 50%; }
.grings b { position: absolute; left: -60px; top: -60px; width: 120px; height: 120px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .5); animation: gring 1.6s ease-out forwards; opacity: 0; }
.grings b:nth-child(2) { animation-delay: .25s; } .grings b:nth-child(3) { animation-delay: .5s; }
.goalfx.theirs .grings b { border-color: rgba(222, 111, 97, .45); }
.gconf i { position: absolute; top: -20px; width: 9px; height: 15px; border-radius: 2px; animation-name: gfall; animation-timing-function: cubic-bezier(.3, .6, .6, 1); animation-fill-mode: forwards; }
.gbody { position: relative; text-align: center; color: #fff; }
.gcrest { display: block; width: 130px; height: 130px; object-fit: contain; margin: 0 auto 10px; filter: drop-shadow(0 10px 26px rgba(0, 0, 0, .6)); animation: gpop .6s cubic-bezier(.2, 1.6, .4, 1) both; }
.gword { font-size: clamp(64px, 14vw, 190px); font-weight: 900; letter-spacing: .04em; line-height: 1; text-shadow: 0 8px 40px rgba(0, 0, 0, .55); animation: gword .7s cubic-bezier(.2, 1.4, .4, 1) .08s both; }
.goalfx.theirs .gword { font-size: clamp(44px, 8vw, 110px); color: #f3d3ce; letter-spacing: .01em; }
.gscore { margin-top: 18px; font-size: 22px; color: rgba(255, 255, 255, .85); display: inline-flex; align-items: center; gap: 10px; animation: gup .5s ease-out .35s both; }
.gscore b { font-size: 30px; color: #fff; font-variant-numeric: tabular-nums; }
.gscore .crest.xs { width: 30px; height: 30px; margin: 0; vertical-align: middle; }
@keyframes gin { from { opacity: 0; } to { opacity: 1; } }
@keyframes gflash { 0% { opacity: .85; } 100% { opacity: 0; } }
@keyframes gring { 0% { transform: scale(.3); opacity: .9; } 100% { transform: scale(9); opacity: 0; } }
@keyframes gfall { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--x), 110vh) rotate(var(--r)); opacity: .9; } }
@keyframes gpop { 0% { transform: scale(.2) rotate(-12deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes gword { 0% { transform: scale(2.6); opacity: 0; letter-spacing: .5em; } 100% { transform: none; opacity: 1; } }
@keyframes gup { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes gshake { 0%, 100% { transform: none; } 20% { transform: translateX(-14px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(5px); } }
@media (prefers-reduced-motion: reduce) { .goalfx *, .goalfx { animation-duration: .01s !important; animation-delay: 0s !important; } .gconf { display: none; } }

/* ---------- animación de final de partido ---------- */
.goalfx.ft.win { background: radial-gradient(circle at 50% 45%, rgba(24, 74, 52, .98), rgba(4, 12, 9, .99) 72%); }

/* ---------- cartas como cartas reales: cuerpo blanco, ilustración enmarcada, texto negro ---------- */
.card { background: linear-gradient(180deg, #fbf9f4, #efeae0); border: 1px solid #cfc8b8; color: #15171b; box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 10px 24px rgba(0, 0, 0, .5); padding: 9px 9px 8px; }
.card::before { height: 6px; border-radius: 10px 10px 0 0; }
.card .cost { background: #15171b; color: #fbf9f4; border: 2px solid #fbf9f4; box-shadow: 0 0 0 1px #15171b; }
.card.tA .cost { background: #9a6a1c; box-shadow: 0 0 0 1px #9a6a1c; } .card.tD .cost { background: #2c66a8; box-shadow: 0 0 0 1px #2c66a8; }
.card.tT .cost { background: #6e52a3; box-shadow: 0 0 0 1px #6e52a3; } .card.tS .cost { background: #2a7c55; box-shadow: 0 0 0 1px #2a7c55; } .card.tX .cost { background: #a8402f; box-shadow: 0 0 0 1px #a8402f; }
.card .ctype { font-weight: 700; color: #5d6168; }
.card.tA .ctype { color: #9a6a1c; } .card.tD .ctype { color: #2c66a8; } .card.tT .ctype { color: #6e52a3; } .card.tS .ctype { color: #2a7c55; } .card.tX .ctype { color: #a8402f; }
.card .ckey { color: #6b6f76; border-color: #c9c2b1; background: transparent; }
.card .cart, .hand .card .cart { width: 100%; margin-left: 0; margin-right: 0; border: 3px solid #5d6168; border-radius: 7px; box-shadow: 0 2px 6px rgba(0, 0, 0, .25), 0 0 0 1px rgba(0, 0, 0, .15); background: #13221a; }
.card.tA .cart { border-color: #d9a85c; } .card.tD .cart { border-color: #73a7e3; } .card.tT .cart { border-color: #b7a0dc; } .card.tS .cart { border-color: #68b98f; } .card.tX .cart { border-color: #de6f61; }
.card .cn { color: #111316; font-weight: 750; }
.card.up .cn { color: #2a7c55; }
.card .cx { color: #1d1f23; }
.card .cf { color: #6b6f76; border-top: 1px solid #ddd6c7; padding-top: 4px; }
button.card:hover:not(:disabled), button.card:focus-visible { border-color: #9aa0aa; box-shadow: 0 16px 30px rgba(0, 0, 0, .6); }
.card.dis { opacity: .55; }

@media (max-width: 700px) {
  html, body { overscroll-behavior: none; }
  .top { flex: 0 0 auto; flex-wrap: wrap; gap: 4px 12px; padding: 8px 10px; white-space: normal; }
  .top .spacer { flex-basis: 100%; height: 0; }
  .top .btn { padding: 4px 9px; font-size: 12px; }
  kbd, .card .ckey { display: none; }
  .stat { font-size: 12px; gap: 4px; } .pips i { width: 4px; height: 10px; }
  .screen { padding: 10px 8px 22px; }
  #app.sc-vestidor .wrap, #app.sc-estadio .wrap { padding: 16px 14px 18px; border-radius: 12px; }
  .title { font-size: 22px; } .sub { font-size: 14px; }
  .grid2 { grid-template-columns: 1fr; gap: 12px; }
  .opt { flex-basis: 100%; min-height: 0; }
  .versus { gap: 10px; } .versus .title { font-size: 19px; } .crest.lg { width: 52px; height: 52px; } .crest.hero { width: 54px; height: 54px; }
  .bigscore { font-size: 26px; flex-wrap: wrap; gap: 8px; } .bigscore .crest.md { width: 32px; height: 32px; }
  .kv { gap: 14px 22px; }
  .match { display: flex; flex-direction: column; overflow-y: auto; padding: 8px; gap: 8px; }
  .pitch { overflow: visible; min-height: auto; flex: none; gap: 7px; }
  .side { flex: none; } .side .panel { overflow: visible; }
  .score { gap: 6px; padding: 8px 10px; } .score .tm { font-size: 13px; gap: 6px; } .score .tm small { display: none; }
  .score .crest.md { width: 28px; height: 28px; } .score .sc b { font-size: 24px; } .score .sc small { font-size: 10px; }
  .meters { gap: 6px; } .meter { padding: 8px 10px; } .meter .ms { display: none; } .meter .mh span { font-size: 10px; letter-spacing: .06em; }
  .intent { grid-template-columns: 1fr; gap: 6px; padding: 9px 12px; } .intent .fc { border-left: 0; padding-left: 0; } .intent .itx { font-size: 15px; }
  .hintbar { flex-wrap: wrap; }
  .controls { flex-wrap: wrap; gap: 6px; } .controls .btn.big { margin-left: auto; }
  .hand { flex: none; justify-content: flex-start; overflow-x: auto; overflow-y: hidden; min-height: 0; padding: 12px 4px 12px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
  .hand .card { scroll-snap-align: start; }
  .card, .hand .card { width: 128px; height: 218px; padding: 8px 8px 7px; }
  .card .cart, .hand .card .cart { height: 40px; } .card .cn { font-size: 13.5px; } .card .cx { font-size: 11.5px; }
  button.card:hover:not(:disabled) { transform: none; }
  .rules .cols { columns: 1; }
  .modal { padding: 8px; }
  .gscore { font-size: 15px; } .gscore b { font-size: 22px; } .gcrest { width: 96px; height: 96px; }
  .ftwhistle { transform: scale(.62); margin: -40px auto -34px; } .ftnums { font-size: 58px; } .ftcrest { width: 58px; height: 58px; } .ftscore { gap: 14px; } .ftteams { gap: 70px; font-size: 13px; }
  #toasts { left: 8px; right: 8px; width: auto; top: auto; bottom: 10px; }
}

<script>
/* Once Ideal - interfaz. Todo el estado del juego vive en Rules; aquí solo se pinta y se guarda. */
(function () {
  'use strict';
  var R = window.Rules;
  var KEY_RUN = 'onceideal.run.v1', KEY_META = 'onceideal.meta.v1';
  var mem = {}, storageOk = true;

  function sget(k) {
    try { var v = window.localStorage.getItem(k); if (v !== null && v !== undefined) return v; } catch (e) { storageOk = false; }
    return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null;
  }
  function sset(k, v) { mem[k] = v; try { window.localStorage.setItem(k, v); } catch (e) { storageOk = false; } }
  function sdel(k) { delete mem[k]; try { window.localStorage.removeItem(k); } catch (e) { storageOk = false; } }
  (function probe() { try { window.localStorage.setItem('onceideal.probe', '1'); window.localStorage.removeItem('onceideal.probe'); } catch (e) { storageOk = false; } })();

  var app = document.getElementById('app'), toasts = document.getElementById('toasts');
  var run = null, meta = null, ui = { modal: null, pile: null, confirm: null }, phaseAt = 0;

  function freshMeta() { return { v: 1, d: [{ p: 0, w: 0, b: 0 }, { p: 0, w: 0, b: 0 }, { p: 0, w: 0, b: 0 }], tut: false }; }
  function loadMeta() {
    try {
      var m = JSON.parse(sget(KEY_META) || 'null');
      if (m && m.v === 1 && Array.isArray(m.d) && m.d.length === 3) {
        for (var i = 0; i < 3; i++) { var x = m.d[i] || {}; m.d[i] = { p: +x.p || 0, w: +x.w || 0, b: +x.b || 0 }; }
        m.tut = !!m.tut; return m;
      }
    } catch (e) { }
    return freshMeta();
  }
  function saveMeta() { try { sset(KEY_META, JSON.stringify(meta)); } catch (e) { } }
  function loadRun() {
    try {
      var r = JSON.parse(sget(KEY_RUN) || 'null');
      if (r && R.check(r).length === 0) return r;
    } catch (e) { }
    return null;
  }
  function saveRun() {
    try { if (run) sset(KEY_RUN, JSON.stringify(run)); else sdel(KEY_RUN); } catch (e) { }
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function rivalName(id) { return R.RIVALS[id].n; }
  function crest(id, cls) {
    var src = CRESTS[id === 'tottenham' ? 'tottenham-white' : id];
    return src ? '<img class="crest ' + (cls || '') + '" src="' + src + '" alt="">' : '';
  }
  function sceneOf() {
    if (!run) return 'estadio';
    var p = run.phase;
    if (p === 'match') return 'cancha';
    if (p === 'post' || p === 'reward' || p === 'week' || p === 'train' || p === 'remove' || p === 'shop') return 'vestidor';
    return 'estadio';
  }
  function curRival() { return R.RIVALS[run.fixtures[run.matchIdx]]; }

  /* ---------- avisos ---------- */
  function toast(text, cls) {
    var el = document.createElement('div');
    el.className = 'toast' + (cls ? ' ' + cls : '');
    el.textContent = text;
    toasts.appendChild(el);
    while (toasts.children.length > 5) toasts.removeChild(toasts.firstChild);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 3900);
  }
  function clearToasts() { toasts.innerHTML = ''; }

  /* ---------- animación de gol (pantalla completa, no bloquea los clics) ---------- */
  var goalQueue = [], goalBusy = false;
  function goalFx(mine, rid, gf, ga) {
    goalQueue.push({ mine: mine, rid: rid, gf: gf, ga: ga });
    if (!goalBusy) nextGoal();
  }
  window.__goalFx = goalFx; // para revisar la animación en pruebas
  function fullTimeFx(l) {
    goalQueue.push({ ft: true, l: l });
    if (!goalBusy) nextGoal();
  }
  window.__fullTimeFx = fullTimeFx;
  function showFullTime(l) {
    var el = document.createElement('div'), conf = '', i, k = l.res === 'W' ? 'win' : l.res === 'D' ? 'draw' : 'loss';
    var word = l.res === 'W' ? 'Victoria' : l.res === 'D' ? 'Empate' : 'Derrota';
    if (k === 'win') {
      var cols = ['#ffffff', '#ece7da', '#d9a85c', '#68b98f', '#132257'];
      for (i = 0; i < 80; i++) conf += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + cols[i % cols.length] +
        ';animation-delay:' + (0.9 + Math.random() * 0.8).toFixed(2) + 's;animation-duration:' + (1.8 + Math.random() * 1.2).toFixed(2) + 's;--r:' + Math.round(Math.random() * 720 - 360) + 'deg;--x:' + Math.round(Math.random() * 160 - 80) + 'px"></i>';
    }
    el.className = 'goalfx ft ' + k;
    el.innerHTML = '<div class="gconf">' + conf + '</div><div class="gbody">' +
      '<div class="ftwhistle"><span class="wave w1"></span><span class="wave w2"></span><span class="wave w3"></span></div>' +
      '<div class="ftlbl">Final del partido</div>' +
      '<div class="ftscore">' + crest('tottenham', 'ftcrest') + '<div class="ftnums"><b>' + l.gf + '</b><span>–</span><b>' + l.ga + '</b></div>' + crest(l.rival, 'ftcrest') + '</div>' +
      '<div class="ftteams"><span>Tottenham</span><span>' + rivalName(l.rival) + '</span></div>' +
      '<div class="gword ftword">' + word + '</div>' +
      '<div class="ftpts">+' + l.pts + (l.pts === 1 ? ' punto' : ' puntos') + (l.fin ? ' · valía doble' : '') + '</div></div>';
    document.body.appendChild(el);
    setTimeout(function () { el.classList.add('out'); }, 3500);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); nextGoal(); }, 3950);
  }
  function nextGoal() {
    var g = goalQueue.shift();
    if (!g) { goalBusy = false; return; }
    goalBusy = true;
    if (g.ft) { showFullTime(g.l); return; }
    var el = document.createElement('div'), conf = '', i;
    el.className = 'goalfx ' + (g.mine ? 'mine' : 'theirs');
    if (g.mine) {
      var cols = ['#ffffff', '#ece7da', '#d9a85c', '#73a7e3', '#132257'];
      for (i = 0; i < 70; i++) {
        conf += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + cols[i % cols.length] +
          ';animation-delay:' + (Math.random() * 0.5).toFixed(2) + 's;animation-duration:' + (1.6 + Math.random() * 1.2).toFixed(2) + 's;--r:' + Math.round(Math.random() * 720 - 360) + 'deg;--x:' + Math.round(Math.random() * 160 - 80) + 'px"></i>';
      }
    }
    el.innerHTML = '<div class="gflash"></div><div class="grings"><b></b><b></b><b></b></div><div class="gconf">' + conf + '</div>' +
      '<div class="gbody">' + crest(g.mine ? 'tottenham' : g.rid, 'gcrest') +
      '<div class="gword">' + (g.mine ? 'GOOOL' : 'Gol de ' + rivalName(g.rid)) + '</div>' +
      '<div class="gscore">' + crest('tottenham', 'xs') + 'Tottenham <b>' + g.gf + ' – ' + g.ga + '</b> ' + rivalName(g.rid) + crest(g.rid, 'xs') + '</div></div>';
    document.body.appendChild(el);
    var dur = g.mine ? 2700 : 2000;
    setTimeout(function () { el.classList.add('out'); }, dur - 450);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); nextGoal(); }, dur);
  }

  /* ---------- acciones ---------- */
  function act(a) {
    if (!run) return;
    var before = run.phase, rid = run.match ? run.match.rival : run.fixtures[run.matchIdx];
    if (!R.apply(run, a)) return;
    var evs = run.ev || [];
    if (a.t === 'end' || (run.phase !== before && run.phase !== 'post' && run.phase !== 'match')) clearToasts();
    if (run.phase !== before) phaseAt = Date.now();
    var sc = run.match || run.last || { gf: 0, ga: 0 }, ng = 0, nc = 0, tg = 0, tc = 0;
    for (var i = 0; i < evs.length; i++) { if (evs[i].k === 'goal') tg++; else if (evs[i].k === 'concede') tc++; }
    for (i = 0; i < evs.length; i++) {
      toast(evs[i].t, evs[i].k === 'goal' ? 'goal' : evs[i].k === 'concede' ? 'concede' : '');
      // marcador tras cada gol: se reconstruye restando los que faltan por mostrar
      if (evs[i].k === 'goal') { ng++; goalFx(true, rid, sc.gf - (tg - ng), sc.ga - (tc - nc)); }
      else if (evs[i].k === 'concede') { nc++; goalFx(false, rid, sc.gf - (tg - ng), sc.ga - (tc - nc)); }
    }
    if (before === 'match' && run.phase !== 'match' && run.last) fullTimeFx(run.last);
    if (before === 'match' && run.phase === 'post' && !meta.tut) { meta.tut = true; saveMeta(); }
    if (run.phase === 'end' && before !== 'end') {
      var d = meta.d[run.diff];
      if (run.end.won) d.w++;
      if (run.points > d.b) d.b = run.points;
      saveMeta();
    }
    saveRun();
    render();
  }
  function startRun(diff) {
    var seed = (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) | 0;
    run = R.newRun(diff, seed);
    meta.d[diff].p++; saveMeta(); saveRun(); clearToasts(); render();
  }
  function abandon() {
    if (run && run.phase !== 'end') { var d = meta.d[run.diff]; if (run.points > d.b) d.b = run.points; saveMeta(); }
    run = null; saveRun(); ui.modal = null; ui.confirm = null; clearToasts(); render();
  }

  /* ---------- piezas ---------- */
  function cardHTML(inst, o) {
    o = o || {};
    var d = R.cdef(inst), m = o.m || null;
    var cls = 'card t' + d.ty + (inst.up ? ' up' : '') + (o.lg ? ' lg' : '') + (o.dis ? ' dis' : '') + (o.sold ? ' sold' : '');
    var inner = '<span class="chead"><span class="cost">' + (d.junk ? '–' : d.c) + '</span><span class="ctype">' + R.TYPE_NAMES[d.ty] + '</span>' +
      (o.key ? '<span class="ckey">' + o.key + '</span>' : '') + '</span>' +
      '<svg class="cart" viewBox="0 0 300 112" aria-hidden="true"><use href="#art-' + d.id + '"/></svg>' +
      '<span class="cn">' + esc(d.n) + '</span>' +
      '<span class="cx">' + esc(R.describe(inst, m)) + '</span>' +
      '<span class="cf"><span>' + esc(d.tag || '') + '</span><span>' + R.RARITY_NAMES[d.r] + '</span></span>';
    if (o.a) {
      return '<button class="' + cls + '" data-a="' + o.a + '" data-i="' + o.i + '"' + (o.k ? ' data-k="' + o.k + '"' : '') +
        (o.key ? ' data-key="' + o.key + '"' : '') + (o.off ? ' disabled' : '') + ' aria-label="' + esc(d.n) + '">' + inner + '</button>';
    }
    return '<div class="' + cls + '">' + inner + '</div>';
  }
  function glossHTML(insts) {
    var seen = {}, out = '', i, j, ks;
    for (i = 0; i < insts.length; i++) {
      ks = R.keywordsOf(insts[i]);
      for (j = 0; j < ks.length; j++) if (!seen[ks[j]]) { seen[ks[j]] = 1; out += '<p><b>' + R.KEYWORDS[ks[j]][0] + '.</b> ' + R.KEYWORDS[ks[j]][1] + '</p>'; }
    }
    return out || '<p>Sin términos especiales.</p>';
  }
  function allGloss() {
    var out = '';
    for (var k in R.KEYWORDS) out += '<p><b>' + R.KEYWORDS[k][0] + '.</b> ' + R.KEYWORDS[k][1] + '</p>';
    return out;
  }
  function pips(n, max) {

    if (st.labo) mine.push(chip('Laboratorio · +' + st.labo + ' Córner por turno'));
    if (m.rv.fatiga) theirs.push(chip('Fatiga ' + m.rv.fatiga + ' · ataca 25% menos'));
    if (m.rv.desorden) theirs.push(chip('Desorden ' + m.rv.desorden + ' · tus Ataques +50%'));
    if (m.rv.buff) theirs.push(chip('Crecido · +' + m.rv.buff + ' a cada ataque'));
    var none = '<span class="chip none">Sin efectos</span>';

    var fc;
    if (f.incoming === 0) fc = 'No ataca este turno: no necesitas Defensa.';
    else {
      fc = 'Tu Defensa: <b>' + m.block + '</b>' + (st.pos ? ' + ' + st.pos + ' de Posesión' : '') + '. Si terminas el turno ahora: ';

    s = '<main class="match"><section class="pitch">' +
      '<div class="score"><div class="tm">' + crest('tottenham', 'md') + '<div>Tottenham<small>Tu equipo</small></div></div>' +
      '<div class="sc"><b>' + m.gf + ' – ' + m.ga + '</b><small>' + tdots + 'Turno ' + m.turn + ' de ' + R.TURNS + ' · minuto ' + ((m.turn - 1) * 15) + ' a ' + (m.turn * 15) + (R.isFinal(run) ? ' · vale doble' : '') + '</small></div>' +
      '<div class="tm rv"><div>' + rv.n + '<small>' + rv.trait + '</small></div>' + crest(m.rival, 'md') + '</div></div>' +

      '<div class="bar"><i style="width:' + pPct + '%"></i></div>' +
      '<div class="ms">Te faltan ' + (m.wall - m.pressure) + ' de Ataque para marcar. Después el Muro sube ' + m.grow + '.</div></div>' +

      s += '<div class="hintbar"><span><b>Ayuda ' + m.turn + '/6.</b> ' + HINTS[m.turn - 1] + '</span><button class="btn" data-a="notut">Ocultar ayudas</button></div>';
    }

  window.addEventListener('resize', function () { layoutHand(); });
  function layoutHand() {
    var hand = document.getElementById('hand');
    if (!hand) return;
    var cs = hand.querySelectorAll('.card'), n = cs.length;
    if (n < 2) return;
    if (window.innerWidth <= 700) { for (var j = 1; j < n; j++) cs[j].style.marginLeft = ''; return; } // en celular la mano se desliza de lado
    var w = cs[0].offsetWidth, avail = hand.clientWidth - 4, gap = 8;
    if (n * w + (n - 1) * gap > avail) gap = Math.floor((avail - w) / (n - 1)) - w;
    for (var i = 1; i < n; i++) cs[i].style.marginLeft = gap + 'px';
  }

      var ok = !it.sold && run.money >= it.price;
      s += '<button class="opt" data-a="buy" data-k="relic" data-i="' + i + '"' + (ok ? '' : ' disabled') + '><span class="on">' + R.RELICS[it.id][0] + '</span><span class="od">' + R.RELICS[it.id][1] + '</span>' +
        '<span class="of"><span>Ventaja permanente</span><span>' + (it.sold ? 'Comprada' : it.price + ' M') + '</span></span></button>';
    });
    s += '</div><div class="actions"><button class="btn primary" data-a="leave" data-key="enter escape">Salir del mercado<kbd>Enter</kbd></button></div>' +
      '<div class="panel" style="margin-top:20px"><h4>Términos de estas cartas</h4><div class="glosslist">' + glossHTML(run.shop.cards) + '</div></div></div></div>';
    return s;
  }

  function endScreen() {
    var e = run.end, t, sub;
    if (e.won) { t = 'Campeones de liga'; sub = 'Tottenham levanta el título con ' + run.points + ' puntos. La directiva renueva tu contrato sin discutir.'; }
    else if (e.reason === 'sacked') { t = 'Te han despedido'; sub = 'La confianza de la directiva llegó a cero tras la jornada ' + run.history.length + '. Sumaste ' + run.points + ' puntos.'; }
    else { t = 'Sin título'; sub = 'Terminaste la temporada con ' + run.points + ' puntos; hacían falta ' + run.target + '.'; }
    var rec = meta.d[run.diff];
    var s = '<div class="screen"><div class="wrap">' + crest('tottenham', 'hero') + '<div class="eyebrow">Fin de temporada · ' + R.DIFFS[run.diff].name + '</div>' +
      '<h2 class="title ' + (e.won ? 'good' : 'bad') + '">' + t + '</h2><p class="sub">' + sub + '</p>' +
      '<div class="grid2"><div class="panel"><h4>Tu temporada</h4>' + calendarHTML() + '</div>' +
      '<div class="panel"><h4>Historial en ' + R.DIFFS[run.diff].name + '</h4><ul class="plain"><li>Temporadas jugadas: <b>' + rec.p + '</b></li><li>Títulos: <b>' + rec.w + '</b></li><li>Mejor puntuación: <b>' + rec.b + '</b></li></ul>' +
      '<h4 style="margin-top:12px">Cuerpo técnico</h4><ul class="plain">' + (run.relics.map(function (r) { return '<li><b>' + R.RELICS[r][0] + '</b></li>'; }).join('') || '<li>Ninguno</li>') + '</ul></div></div>' +
      '<div class="actions"><button class="btn primary big" data-a="home" data-key="enter">Nueva temporada<kbd>Enter</kbd></button><button class="btn" data-a="deck">Ver plantilla final</button></div></div></div>';
    return s;
  }

  /* ---------- modales ---------- */
  function rulesModal() {
    return '<div class="modal" data-a="close-bg"><div class="sheet"><div class="sh"><h3>Reglas</h3><button class="btn" data-a="close" data-key="escape r">Cerrar<kbd>Esc</kbd></button></div>' +
      '<div class="sb rules"><div class="actions" style="margin:0 0 14px"><button class="btn" data-a="allcards">Ver todas las cartas</button></div><div class="cols">' +
      '<div><h4>Objetivo</h4><p>Diriges al Tottenham durante 10 jornadas. Ganas la temporada si al final sumas los puntos de la meta (arriba, junto a tus puntos) y la directiva no te ha despedido. La última jornada es contra un candidato al título y vale doble: 6 puntos la victoria, 2 el empate.</p></div>' +
      '<div><h4>El partido</h4><p>Cada partido dura 6 turnos de 15 minutos. Cada turno robas 5 cartas y tienes 3 de energía. Cada carta cuesta la energía de su círculo. Al terminar el turno, las cartas que no jugaste van al descarte; cuando el mazo se acaba, el descarte se baraja y vuelve.</p></div>' +
      '<div><h4>Marcar: Presión contra Muro</h4><p>Las cartas de Ataque suman Presión. Cuando tu Presión alcanza el Muro rival marcas gol: lo que sobra se conserva y el Muro sube para el siguiente. La Presión no se pierde entre turnos.</p></div>' +
      '<div><h4>Defender: Peligro contra Línea</h4><p>El rival anuncia su intención antes de que juegues y la ejecuta cuando terminas el turno. Si ataca, tu Defensa absorbe el golpe; lo que no cubras se suma a tu Peligro. Cuando el Peligro alcanza tu Línea recibes gol y el medidor conserva lo que sobra. La Defensa se pierde al final de cada turno; el Peligro no.</p></div>' +
      '<div><h4>Intenciones del rival</h4><ul><li><b>Ataca por N:</b> N de Peligro si no lo cubres. A veces son varios golpes.</li><li><b>Se repliega:</b> su Muro sube.</li><li><b>Despeja:</b> tu Presión baja.</li><li><b>Presiona tu salida:</b> el próximo turno robas 1 carta menos.</li><li><b>Marca al hombre:</b> el próximo turno tienes 1 de energía menos.</li><li><b>Juego brusco:</b> mete una Tarjeta amarilla (carta inútil) en tu mazo durante ese partido.</li><li><b>Te quita el balón:</b> pierdes Posesión.</li><li><b>Se crece:</b> sus ataques suben el resto del partido.</li></ul></div>' +
      '<div><h4>Tipos de carta</h4><ul><li><b>Ataque:</b> genera Presión.</li><li><b>Defensa:</b> cubre el golpe rival de este turno.</li><li><b>Táctica:</b> roba cartas, da energía o debilita al rival.</li><li><b>Sistema:</b> efecto que dura todo el partido.</li></ul></div>' +
      '<div><h4>Puntos y confianza</h4><p>Victoria 3 puntos, empate 1, derrota 0. La Confianza de la directiva es tu vida: una victoria suma 1, un empate resta 1, una derrota resta 3 y una goleada en contra (3 goles o más de diferencia) resta 4. Si llega a 0 te despiden y la temporada termina.</p></div>' +
      '<div><h4>Entre partidos</h4><p>Tras cada partido eliges 1 carta nueva (o ninguna) y cobras presupuesto: 25 M por ganar, 15 M por empatar, 10 M por perder. Después eliges una actividad: Entrenamiento (mejora una carta), Dar salida (quita una carta) o Día libre (+1 de Confianza); solo aparecen dos cada semana. Antes puedes pasar por el Mercado. Al empezar y a mitad de temporada eliges un refuerzo del club con una ventaja permanente.</p></div>' +
      '<div><h4>Teclas</h4><ul><li><b>1 a 9 y 0:</b> jugar la carta de esa posición o elegir esa opción.</li><li><b>E o Enter:</b> terminar turno o continuar.</li><li><b>M:</b> plantilla. <b>R:</b> reglas. <b>Esc:</b> cerrar o volver.</li></ul></div>' +
      '<div><h4>Consejos</h4><ul><li>Lee la intención antes de gastar energía: si el rival no ataca, toda la energía puede ir al ataque.</li><li>El Peligro acumulado es un recurso: puedes dejar pasar golpes mientras no llegues a tu Línea.</li><li>Busca sinergias: Posesión con Pase filtrado, Fatiga con Jauría y Asfixia, Defensa con Salida rápida, Córners con el Especialista.</li><li>No tomes todas las cartas: un mazo de 12 a 16 buenas rinde más que uno de 25.</li></ul></div>' +
      '</div><h4>Glosario</h4><div class="glosslist cols">' + allGloss() + '</div></div></div></div>';
  }
  function allCardsModal() {
    var s = '<div class="modal" data-a="close-bg"><div class="sheet"><div class="sh"><h3>Todas las cartas</h3><button class="btn" data-a="rules" data-key="escape">Volver a Reglas<kbd>Esc</kbd></button></div><div class="sb">' +
      '<p class="muted" style="margin-bottom:12px;font-size:13px">Cada carta aparece en su versión normal y, en verde, mejorada.</p><div class="cards">';
    var order = { A: 0, D: 1, T: 2, S: 3, X: 4 };
    Object.keys(R.CARDS).sort(function (a, b) { return order[R.CARDS[a].ty] - order[R.CARDS[b].ty] || R.CARDS[a].r - R.CARDS[b].r || R.CARDS[a].n.localeCompare(R.CARDS[b].n); }).forEach(function (id) {
      s += cardHTML({ id: id, up: 0 }, {});
      if (R.CARDS[id].u) s += cardHTML({ id: id, up: 1 }, {});
    });
    return s + '</div></div></div></div>';
  }
  function deckModal() {
    var s = '<div class="modal" data-a="close-bg"><div class="sheet"><div class="sh"><h3>Plantilla · ' + run.deck.length + ' cartas</h3><button class="btn" data-a="close" data-key="escape m">Cerrar<kbd>Esc</kbd></button></div><div class="sb">' +
      '<div class="panel" style="margin-bottom:14px"><h4>Cuerpo técnico e instalaciones</h4><ul class="plain">' +
      (run.relics.map(function (r) { return '<li><b>' + R.RELICS[r][0] + '.</b> ' + R.RELICS[r][1] + '</li>'; }).join('') || '<li>Todavía ninguno.</li>') + '</ul></div><div class="cards">';
    sortedDeck().forEach(function (x) { s += cardHTML(x.c, {}); });
    s += '</div><div class="panel" style="margin-top:14px"><h4>Términos</h4><div class="glosslist">' + glossHTML(run.deck) + '</div></div></div></div></div>';
    return s;
  }
  function pileModal() {
    var m = run.match, names = { draw: 'Mazo por robar', discard: 'Descarte', exhaust: 'Agotadas' };
    var list = (m[ui.pile] || []).slice().sort(function (a, b) { return R.cdef(a).n.localeCompare(R.cdef(b).n); });
    var s = '<div class="modal" data-a="close-bg"><div class="sheet"><div class="sh"><h3>' + names[ui.pile] + ' · ' + list.length + '</h3><button class="btn" data-a="close" data-key="escape">Cerrar<kbd>Esc</kbd></button></div><div class="sb">' +
      (ui.pile === 'draw' ? '<p class="muted" style="margin-bottom:12px;font-size:13px">En orden alfabético, no en el orden en que saldrán.</p>' : '') + '<div class="cards">';
    list.forEach(function (c) { s += cardHTML(c, { m: m }); });
    if (!list.length) s += '<p class="muted">Vacío.</p>';
    return s + '</div></div></div></div>';
  }
  function confirmModal() {
    return '<div class="modal"><div class="sheet sm"><div class="sh"><h3>Salir de la temporada</h3></div><div class="sb"><p class="muted">Si solo quieres parar, cierra la pestaña o la tapa: la temporada se guarda sola y sigue donde la dejaste. Abandonar la termina, cuenta como jugada y no se puede deshacer.</p>' +
      '<div class="actions"><button class="btn primary" data-a="close" data-key="escape enter">Seguir jugando</button><button class="btn danger" data-a="abandon">Abandonar temporada</button></div></div></div></div>';
  }

  /* ---------- render ---------- */
  function render() {
    var body;
    if (!run) body = homeScreen();
    else switch (run.phase) {
      case 'relic': body = relicScreen(); break;
      case 'prematch': body = prematchScreen(); break;
      case 'match': body = matchScreen(); break;
      case 'post': body = postScreen(); break;
      case 'reward': body = rewardScreen(); break;
      case 'week': body = weekScreen(); break;
      case 'train': case 'remove': body = pickDeckScreen(run.phase); break;
      case 'shop': body = shopScreen(); break;
      default: body = endScreen();
    }
    var modal = '';
    if (ui.modal === 'rules') modal = rulesModal();
    else if (ui.modal === 'all') modal = allCardsModal();
    else if (ui.modal === 'deck' && run) modal = deckModal();
    else if (ui.modal === 'pile' && run && run.match) modal = pileModal();
    else if (ui.modal === 'confirm' && run) modal = confirmModal();
    else ui.modal = null;
    app.className = 'sc-' + sceneOf();
    app.innerHTML = topBar() + body + modal;
    layoutHand();
  }

  function handle(a, el) {
    var i = el ? el.getAttribute('data-i') : null, n = i === null ? 0 : parseInt(i, 10);
    switch (a) {
      case 'new': startRun(n); break;
      case 'play': act({ t: 'play', i: n }); break;
      case 'end': act({ t: 'end' }); break;
      case 'go': act({ t: 'go' }); break;
      case 'skip': act({ t: 'skip' }); break;
      case 'pick': act({ t: 'pick', i: n }); break;
      case 'act': act({ t: 'act', i: n }); break;
      case 'shop': act({ t: 'shop' }); break;
      case 'skipweek': act({ t: 'skipweek' }); break;
      case 'back': act({ t: 'back' }); break;
      case 'leave': act({ t: 'leave' }); break;
      case 'buy': act({ t: 'buy', k: el.getAttribute('data-k'), i: n }); break;
      case 'rules': ui.modal = 'rules'; render(); break;
      case 'deck': ui.modal = 'deck'; render(); break;
      case 'allcards': ui.modal = 'all'; render(); break;
      case 'pile': ui.modal = 'pile'; ui.pile = i; render(); break;
      case 'menu': if (run && run.phase === 'end') { abandon(); } else { ui.modal = 'confirm'; render(); } break;
      case 'close': ui.modal = null; render(); break;
      case 'abandon': abandon(); break;
      case 'home': abandon(); break;
      case 'notut': meta.tut = true; saveMeta(); render(); break;
    }
  }

  app.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== app && !(el.getAttribute && el.getAttribute('data-a'))) el = el.parentNode;
    if (!el || el === app) return;
    var a = el.getAttribute('data-a');
    if (a === 'close-bg') { if (e.target === el) { ui.modal = null; render(); } return; }
    if (el.disabled) return;
    handle(a, el);
  });

  document.addEventListener('keydown', function (e) {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase();
    if (k === ' ') return;
    // evita que un doble Enter salte una pantalla o termine el turno sin querer
    if (k === 'enter' && Date.now() - phaseAt < 450) { e.preventDefault(); return; }
    var scope = app.querySelector('.modal') || app;
    var els = scope.querySelectorAll('[data-key]');
    for (var i = 0; i < els.length; i++) {
      var keys = els[i].getAttribute('data-key').split(' ');
      if (keys.indexOf(k) >= 0) {
        e.preventDefault();
        if (!els[i].disabled) handle(els[i].getAttribute('data-a'), els[i]);
        return;
      }
    }
  });
  window.addEventListener('resize', layoutHand);
  window.addEventListener('pagehide', saveRun);
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveRun(); });

  meta = loadMeta();
  run = loadRun();
  render();
  window.__onceIdeal = { state: function () { return run; }, meta: function () { return meta; } };
})();

</script>
</body>
</html>
