<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Náufrago</title>
<style>
:root{--bg:#0f1114;--panel:#15181c;--line:#272b32;--text:#e9e6de;--dim:#8b9099;--accent:#e8c170;--ok:#6fd3b0;--bad:#e0705f;--paper:#ece7da;--ink:#1c1a16;--g:#5fb58c;--y:#e3c15a;--r:#d9655b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
#app{min-height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;letter-spacing:.16em}
.brand span{color:var(--dim);font-weight:400;letter-spacing:.04em;margin-left:10px;font-size:13px}
button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 13px;cursor:pointer}
button:hover{border-color:#4a505a}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#17130a;font-weight:600}
button.danger{border-color:#6a3731;color:#f0a79c}
button small{color:var(--dim);margin-left:6px;font-size:12px}
button.primary small{color:#5a4a22}
nav{display:flex;gap:8px}
#status{display:flex;gap:26px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line)}
.lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:block}
.val{font-size:17px;font-variant-numeric:tabular-nums}
.pips{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.pips i{width:7px;height:14px;border-radius:2px;background:#2a2e36;display:block}
.pips i.on{background:var(--bad)}
.steps{display:inline-flex;gap:6px}
.steps i{font-style:normal;font-size:12px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
.steps i.on.s0{background:var(--g);border-color:var(--g);color:#0c1f16}
.steps i.on.s1{background:var(--y);border-color:var(--y);color:#2a2206}
.steps i.on.s2{background:var(--r);border-color:var(--r);color:#2a0b08}
.steps i.on.s3{background:var(--text);border-color:var(--text);color:#111}
#layout{flex:1;display:grid;grid-template-columns:1fr 250px;min-height:0}
main{padding:18px;overflow:auto}
aside{border-left:1px solid var(--line);padding:14px;overflow:auto}
aside h4,main h4{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500}
.log{font-size:13px;color:var(--dim);margin-top:16px}
.log div{padding:3px 0;border-top:1px solid #1c1f24}
.log div:first-child{color:var(--text)}
.cards{display:flex;gap:10px;flex-wrap:wrap;min-height:128px}
.card{width:96px;height:128px;border-radius:8px;background:var(--paper);color:var(--ink);padding:8px;position:relative;display:flex;flex-direction:column;border:2px solid transparent;flex:none}
.card .cv{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.card .cn{font-size:12px;margin-top:6px;font-weight:600}
.card .ca{margin-top:auto;font-size:11.5px;font-weight:600;background:#1c1a16;color:var(--paper);border-radius:4px;padding:3px 5px;text-align:center}
.card .ca.off{background:transparent;color:#9a9484;text-decoration:line-through;border:1px solid #cfc8b6}
.card .ca.none{visibility:hidden}
.card.k-aging{background:#d9cfd6}
.card.k-aging .ca{background:#6a2f3d}
.card .ci{position:absolute;top:8px;right:7px;width:32px;height:32px;color:#5b5548}
.card.k-aging .ci{color:#7a5364}
.hazard{position:relative}.hazard .hi{position:absolute;top:10px;right:10px;width:30px;height:30px;color:#8792a0}
.hazard .hn{padding-right:34px}
.pirate{position:relative}.pirate .pi{position:absolute;top:10px;right:10px;width:26px;height:26px;color:#8a4a44}
.pirate .pn{padding-right:30px}
.card.k-aging::after{content:"vejez";position:absolute;top:42px;right:8px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#7a5364}
.card.can{border-color:var(--accent);cursor:pointer}
.card.pick{border-color:var(--ok);cursor:pointer}
.card.sel{border-color:var(--bad);opacity:.55}
.card.dim{opacity:.45}
.card.dead{background:#3a3d44;color:#9aa0aa}
.card.dead .ca{display:none}
.card .tag{position:absolute;top:-8px;right:-8px;background:var(--accent);color:#17130a;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.slot{width:96px;height:128px;border-radius:8px;border:1px dashed #343944;flex:none}
.hazard{width:178px;border-radius:10px;background:#1b1f25;border:2px solid var(--line);padding:12px;flex:none}
.hazard.choice{cursor:pointer}
.hazard.choice:hover{border-color:var(--accent)}
.hazard .hn{font-weight:600;font-size:15px}
.hazard .hrow{display:flex;align-items:center;gap:8px;margin:10px 0}
.hazard .free{background:var(--paper);color:var(--ink);font-weight:700;border-radius:4px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center}
.hv{display:flex;gap:6px;margin-bottom:12px}
.hv i{font-style:normal;font-weight:700;width:34px;height:30px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;opacity:.3;color:#111;font-variant-numeric:tabular-nums}
.hv i.g{background:var(--g)}.hv i.y{background:var(--y)}.hv i.r{background:var(--r)}
.hv i.on{opacity:1;outline:2px solid var(--text);outline-offset:1px}
.hk{border-top:1px solid var(--line);padding-top:9px;font-size:13px}
.hk b{display:block;font-size:14px}
.hk em{font-style:normal;color:var(--accent);font-size:12.5px}
.pirate{border-radius:10px;background:#0a0b0d;border:1px solid #3a2523;padding:11px;margin-bottom:10px}
.pirate.choice{cursor:pointer}
.pirate.choice:hover{border-color:var(--accent)}
.pirate.done{opacity:.4}
.pirate .pn{font-weight:600}
.pirate .pt{font-size:12.5px;color:var(--dim);margin-top:5px}
.pirate .pv{display:flex;gap:14px;margin-top:6px;font-size:13px;color:var(--dim)}
.pirate .pv b{color:var(--text);font-size:16px}
.fight{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start}
.scoreline{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.scoreline .n{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
.scoreline .n.win{color:var(--ok)}.scoreline .n.lose{color:var(--bad)}
.scoreline .vs{color:var(--dim)}
.zone{margin-bottom:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.banner{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;gap:14px;align-items:center}
.pairrow{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0}
.menu{max-width:620px;margin:30px auto}
.menu h1{font-size:34px;letter-spacing:.14em;margin:0 0 6px;font-weight:600}
.menu p{color:var(--dim)}
.lv{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.lv b{display:block}.lv span{color:var(--dim);font-size:13px}
#modal{position:fixed;inset:0;background:rgba(10,11,13,.86);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:720px;width:100%;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:20px}
.sheet h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:18px 0 6px;font-weight:500}
.sheet p,.sheet li{color:#c9c6be;font-size:14px}
.sheet ul{padding-left:18px;margin:6px 0}
.sheet table{border-collapse:collapse;width:100%;font-size:14px}
.sheet td{padding:4px 8px 4px 0;border-top:1px solid var(--line);vertical-align:top}
.sheet td:first-child{white-space:nowrap;color:var(--accent);font-weight:600}
.sortrow{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0}
.sortcol{display:flex;flex-direction:column;gap:6px;align-items:center}
.sortcol .ord{font-size:12px;color:var(--dim)}
.mini{display:flex;gap:4px}
.mini button{padding:3px 9px}
.scoretab{border-top:1px solid var(--line);margin:14px 0;max-width:380px}
.scoretab div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
@media (max-width:900px){#layout{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line)}.fight{grid-template-columns:1fr}}

header, #status { background: rgba(10, 11, 13, .82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
aside { background: rgba(10, 11, 13, .74); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
main { text-shadow: 0 1px 3px rgba(0, 0, 0, .85); }
main .card, main .hazard, main button { text-shadow: none; }
.banner, .menu, .sheet { background: rgba(14, 16, 20, .88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.menu { padding: 26px 30px; border: 1px solid var(--line); border-radius: 14px; }
.sheet { background: #15181c; }

/* ---------- cartas reales: cuerpo blanco, ilustración enmarcada, texto negro ---------- */
.card { width: 126px; height: 196px; padding: 7px 7px 8px; border-radius: 10px; border: 1px solid #cfc8b8; background: linear-gradient(180deg, #fbf9f4, #efe9dd); color: #15171b; box-shadow: 0 10px 22px rgba(0, 0, 0, .5); display: flex; flex-direction: column; text-align: left; }
.card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; border-radius: 10px 10px 0 0; background: #c79a5a; }
.card.k-know::before { background: #3d8a62; } .card.k-aging::before { background: #7d5a96; }
.card.k-aging { background: linear-gradient(180deg, #f6f2f7, #e7e0ea); }
.card.k-aging::after { content: none; }
.card .chead { display: flex; align-items: center; justify-content: space-between; margin-top: 3px; }
.card .cv { font-size: 22px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.card .ck { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: #9a6a1c; }
.card.k-know .ck { color: #2a7c55; } .card.k-aging .ck { color: #6d4a86; }
.card .cart { display: block; width: 100%; height: 64px; margin-top: 5px; border: 3px solid #c79a5a; border-radius: 6px; box-shadow: 0 2px 5px rgba(0, 0, 0, .25); background: #222; }
.card.k-know .cart { border-color: #3d8a62; } .card.k-aging .cart { border-color: #7d5a96; }
.card .cn { font-size: 13px; font-weight: 750; margin-top: 6px; line-height: 1.15; color: #111316; }
.card .cx { font-size: 10.5px; line-height: 1.3; color: #1d1f23; margin-top: 3px; overflow: hidden; }
.card .cx b { font-weight: 700; } .card .cx b.off { text-decoration: line-through; color: #8a8577; }
.card.can { border: 2px solid var(--accent); box-shadow: 0 0 0 3px rgba(232, 193, 112, .35), 0 10px 22px rgba(0, 0, 0, .5); }
.card.pick { border: 2px solid var(--ok); box-shadow: 0 0 0 3px rgba(111, 211, 176, .35), 0 10px 22px rgba(0, 0, 0, .5); }
.card.dead { background: repeating-linear-gradient(45deg, #2c3038, #2c3038 8px, #262a31 8px, #262a31 16px); color: #c9ccd2; border-color: #3a3f48; }
.card.dead::before { background: #555; } .card.dead .cn { color: #e9e6de; margin-top: 70px; } .card.dead .cx { color: #aab0b9; }
.slot { width: 126px; height: 196px; border-color: rgba(255, 255, 255, .25); }
.cards { min-height: 196px; }
.hazard { width: 214px; background: linear-gradient(180deg, #fbf9f4, #efe9dd); color: #15171b; border: 1px solid #cfc8b8; box-shadow: 0 12px 26px rgba(0, 0, 0, .55); padding: 10px 11px 12px; }
.hazard.choice:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232, 193, 112, .45), 0 12px 26px rgba(0, 0, 0, .55); }
.hazard .hn { font-weight: 800; font-size: 15px; color: #111316; padding-right: 0; }
.hazard .hart { display: block; width: 100%; height: 108px; margin-top: 7px; border: 3px solid #b0563f; border-radius: 7px; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); }
.hazard .hrow { color: #3a3d44; font-size: 13px; margin: 9px 0 8px; }
.hazard .free { background: #15171b; color: #fbf9f4; }
.hazard .hk { border-top: 1px solid #ddd6c7; color: #1d1f23; font-size: 11.5px; line-height: 1.35; }
.hazard .hk .lab { color: #6b6f76; }
.hazard .hk b { color: #111316; font-size: 13.5px; margin: 2px 0; }
.hazard .hk em { color: #2a7c55; font-weight: 700; font-size: 11.5px; }
.hazard .lab { color: #6b6f76; }
.pirate { background: linear-gradient(180deg, #f4f1ea, #e3ddd1); color: #15171b; border: 1px solid #cfc8b8; box-shadow: 0 8px 18px rgba(0, 0, 0, .45); }
.pirate .part { display: block; width: 100%; height: 92px; border: 3px solid #26304f; border-radius: 6px; margin-bottom: 8px; }
.pirate .pn { color: #111316; font-weight: 800; padding-right: 0; }
.pirate .pv { color: #4a4e56; } .pirate .pv b { color: #111316; }
.pirate .pt { color: #2a2d33; }
.pirate.done { opacity: .45; filter: grayscale(1); }
.pirate.choice:hover { border-color: var(--accent); }
.fight { grid-template-columns: 230px 1fr; }
.fight > div:first-child .pirate { width: 214px; }

/* ---------- animaciones ---------- */
.fx { position: fixed; inset: 0; z-index: 80; pointer-events: none; display: flex; align-items: center; justify-content: center; overflow: hidden; animation: fxin .25s ease-out; color: #fff; text-align: center; }
.fx.out { opacity: 0; transition: opacity .42s ease-in; }
.fx.won { background: radial-gradient(circle at 50% 45%, rgba(28, 86, 58, .97), rgba(4, 12, 9, .99) 72%); }
.fx.lost { background: radial-gradient(circle at 50% 45%, rgba(92, 26, 22, .97), rgba(12, 4, 4, .99) 72%); animation: fxin .2s ease-out, fxshake .45s ease-in-out .15s; }
.fx.sunk { background: radial-gradient(circle at 50% 45%, rgba(26, 42, 92, .97), rgba(4, 6, 18, .99) 72%); }
.fx.stage.s1 { background: linear-gradient(180deg, rgba(58, 43, 92, .97), rgba(242, 166, 90, .95)); }
.fx.stage.s2 { background: linear-gradient(180deg, rgba(5, 8, 26, .98), rgba(26, 35, 80, .97)); }
.fx.stage.s3 { background: radial-gradient(circle at 50% 45%, rgba(20, 30, 70, .97), rgba(3, 5, 14, .99) 72%); }
.fx.victory { background: radial-gradient(circle at 50% 45%, rgba(38, 120, 160, .97), rgba(6, 20, 32, .99) 72%); }
.fx.defeat { background: radial-gradient(circle at 50% 45%, rgba(50, 40, 70, .97), rgba(6, 4, 10, .99) 72%); }
.fxflash { position: absolute; inset: 0; background: #fff; opacity: 0; animation: fxflash .5s ease-out; }
.fx.lost .fxflash { background: #e0705f; }
.fxconf i { position: absolute; top: -20px; width: 9px; height: 15px; border-radius: 2px; animation-name: fxfall; animation-timing-function: cubic-bezier(.3, .6, .6, 1); animation-fill-mode: forwards; }
.fxbody { position: relative; display: flex; flex-direction: column; align-items: center; }
.fxart { display: block; width: 300px; height: 170px; border: 4px solid rgba(255, 255, 255, .85); border-radius: 12px; box-shadow: 0 16px 40px rgba(0, 0, 0, .6); animation: fxpop .55s cubic-bezier(.2, 1.5, .4, 1) both; }
.fxship { animation: fxsink 2.4s ease-in .5s both; }
.fxlbl { margin-top: 16px; font-size: 15px; letter-spacing: .26em; text-transform: uppercase; color: rgba(255, 255, 255, .72); animation: fxup .45s ease-out .3s both; }
.fxword { margin-top: 6px; font-size: clamp(48px, 8.5vw, 116px); font-weight: 900; line-height: 1.02; letter-spacing: .01em; text-shadow: 0 8px 36px rgba(0, 0, 0, .55); animation: fxword .65s cubic-bezier(.2, 1.4, .4, 1) .15s both; }
.fx.won .fxword { color: #a9ecc8; } .fx.lost .fxword { color: #f6c8c0; } .fx.victory .fxword { color: #fff3c4; }
.fxsub { margin-top: 10px; font-size: 19px; color: rgba(255, 255, 255, .85); max-width: 640px; animation: fxup .45s ease-out .5s both; }
.fxsub.big { font-size: 34px; font-weight: 800; color: #fff; }
.fxcard { margin-top: 12px; animation: fxpop .5s cubic-bezier(.2, 1.5, .4, 1) .65s both; }
.fxcard .card { box-shadow: 0 0 0 4px rgba(169, 236, 200, .55), 0 16px 34px rgba(0, 0, 0, .6); }
@keyframes fxin { from { opacity: 0; } to { opacity: 1; } }
@keyframes fxflash { 0% { opacity: .8; } 100% { opacity: 0; } }
@keyframes fxfall { 0% { transform: translate(0, 0) rotate(0); } 100% { transform: translate(var(--x), 110vh) rotate(var(--r)); } }
@keyframes fxpop { 0% { transform: scale(.3) rotate(-8deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes fxword { 0% { transform: scale(2.4); opacity: 0; letter-spacing: .4em; } 100% { transform: none; opacity: 1; } }
@keyframes fxup { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fxshake { 0%, 100% { transform: none; } 20% { transform: translateX(-14px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(5px); } }
@keyframes fxsink { 0% { transform: none; } 30% { transform: rotate(-6deg); } 100% { transform: translateY(70px) rotate(14deg); opacity: .25; } }
@media (max-height: 720px) { .fxart { width: 240px; height: 136px; } .fxword { font-size: 64px; } }
@media (prefers-reduced-motion: reduce) { .fx, .fx * { animation-duration: .01s !important; animation-delay: 0s !important; } .fxconf { display: none; } }

/* ---------- celular ---------- */
@media (max-width: 900px) { .fight { grid-template-columns: 1fr; } }
@media (max-width: 700px) {
  header { padding: 8px 10px; } .brand { font-size: 14px; } .brand span { display: none; }
  nav { gap: 6px; } nav button { padding: 5px 9px; font-size: 13px; }
  button small { display: none; }
  #status { display: grid; grid-template-columns: auto 1fr 1fr; gap: 4px 12px; padding: 7px 10px; }
  #status > div:nth-child(2) { grid-column: 2 / -1; }
  #status .pips { display: none; } .steps i { padding: 1px 7px; font-size: 11px; }
  #status .val { font-size: 14px; } #status .lab { font-size: 9.5px; } .pips i { width: 5px; height: 11px; }
  main { padding: 10px 8px 90px; }
  aside { padding: 12px 8px; }
  aside > .pirate { display: inline-block; vertical-align: top; width: calc(50% - 4px); margin-right: 4px; padding: 8px; font-size: 13px; }
  aside .pirate .part { height: 64px; } aside .pirate .pt { font-size: 11px; }
  .pairrow { gap: 8px; flex-wrap: nowrap; }
  .pairrow .hazard { width: calc(50% - 4px); padding: 8px; }
  .hazard .hn { font-size: 13px; } .hazard .hart { height: 78px; } .hazard .hv i { width: 28px; height: 26px; } .hazard .hk { font-size: 10.5px; } .hazard .hk b { font-size: 12px; }
  .fight > div:first-child .hazard, .fight > div:first-child .pirate { width: 100%; display: grid; grid-template-columns: 120px 1fr; column-gap: 10px; align-items: start; }
  .fight > div:first-child .hazard .hart, .fight > div:first-child .pirate .part { grid-row: span 4; height: 72px; margin-top: 0; }
  .fight > div:first-child .hazard .hn { grid-column: 1 / -1; margin-bottom: 6px; }
  .fight > div:first-child .hazard .hk { grid-column: 1 / -1; }
  .scoreline { margin: 4px 0 8px; } .scoreline .n { font-size: 30px; }
  .cards { gap: 7px; min-height: 0; }
  .card, .slot { width: calc((100vw - 16px - 14px) / 3); height: 186px; }
  .card .cart { height: 50px; } .card .cv { font-size: 19px; } .card .ck { font-size: 8px; } .card .cn { font-size: 12px; } .card .cx { font-size: 10px; }
  .actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; margin: 0; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); background: rgba(10, 11, 13, .92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
  .actions button { flex: 1; padding: 11px 10px; }
  .actions span { display: none; }
  .banner { flex-direction: column; align-items: stretch; font-size: 14px; }
  .menu { margin: 10px auto; padding: 18px 16px; } .menu h1 { font-size: 26px; }
  .sortrow { gap: 8px; } .sortcol .card { width: 104px; }
  .fxart { width: 240px; height: 136px; } .fxword { font-size: 46px; } .fxsub { font-size: 16px; padding: 0 16px; } .fxsub.big { font-size: 26px; }
}

// Reglas de Náufrago (solitario de construcción de mazo). Sin DOM: lo usan el juego y las pruebas.
let RAND = Math.random;
function setRand(f) { RAND = f; }
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RAND() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// habilidad: [etiqueta, explicación]
const AB = {
  life1: ['+1 vida', 'Recuperas 1 punto de vida.'],

  [1, 'Comida', 0, 'life1'], [1, 'Comida', 0, 'life1'], [1, 'Equipo', 0, 'card2'], [1, 'Equipo', 0, 'card2'],

  [2, 'Comida', 1, 'life1'], [2, 'Comida', 1, 'life1'], [2, 'Arma', 2, null], [2, 'Arma', 2, null],
  [2, 'Revelación', 1, 'destroy'], [2, 'Mimetismo', 1, 'copy'], [2, 'Repetición', 1, 'double'], [2, 'Engaño', 1, 'below'],

const PIRATES = [
  { name: 'Balandra', free: 6, val: 20 }, { name: 'Goleta', free: 7, val: 25 }, { name: 'Bergantín', free: 8, val: 30 },
  { name: 'Fragata', free: 9, val: 35 }, { name: 'Galeón', free: 10, val: 40 },
  { name: 'Los Usureros', free: 7, val: 16, sp: 'cost2', txt: 'Cada carta extra cuesta 2 de vida.' },
  { name: 'Los Mezquinos', free: 10, val: 20, sp: 'half', txt: 'Solo cuenta la mitad de tus cartas (las de envejecimiento cuentan a fuerza).' },

function say(G, t) { G.log.push(t); if (G.log.length > 60) G.log.shift(); }

}

const STEP_NAME = ['verde', 'amarilla', 'roja'];

  if (p.ab === 'copy') { G.phase = 'fight'; G.pend = null; say(G, src.c.name + ' copia ' + AB[t.c.ab][0] + '.'); runAbility(G, src.eid, t.c.ab); return; }

  else { // cambiar
    F.e.splice(at, 1); G.disc.push(t.c); say(G, 'Cambias ' + t.c.name + '.');
    drawInto(G, t.side, at);
    if (G.phase === 'over') return;

// Aplica una acción. Devuelve false si no es legal.

    case 'pirate': {

}

  for (const c of owned(G)) cards += c.kind === 'aging' ? -5 : c.val;

const ENGINE = { setRand, shuffle, AB, AGING_AB, HZ, KNOW, PIRATES, newGame, act, evalFight, targetOf, canFree, drawCost, canDraw, canUse, validTarget, hasCards, owned, score, agingAdded, destroyCost, entry };

// ---------- animaciones a pantalla completa (no bloquean los clics) ----------
const fxQueue = [];
let fxBusy = false;
function fx(kind, html, ms) { fxQueue.push({ kind, html, ms }); if (!fxBusy) nextFx(); }
function nextFx() {
  const f = fxQueue.shift();
  if (!f) { fxBusy = false; return; }
  fxBusy = true;
  const el = document.createElement('div');
  el.className = 'fx ' + f.kind;
  let conf = '';
  if (f.kind === 'victory' || f.kind === 'won') {
    const cols = ['#ffe27a', '#f6e6bd', '#6fd3b0', '#8cc3d6', '#e8873a'];
    for (let i = 0; i < (f.kind === 'victory' ? 90 : 40); i++) conf += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + cols[i % 5] + ';animation-delay:' + (Math.random() * 0.6).toFixed(2) + 's;animation-duration:' + (1.6 + Math.random() * 1.3).toFixed(2) + 's;--r:' + Math.round(Math.random() * 720 - 360) + 'deg;--x:' + Math.round(Math.random() * 160 - 80) + 'px"></i>';
  }
  el.innerHTML = '<div class="fxflash"></div><div class="fxconf">' + conf + '</div><div class="fxbody">' + f.html + '</div>';
  document.body.appendChild(el);
  setTimeout(() => el.classList.add('out'), f.ms - 420);
  setTimeout(() => { el.remove(); nextFx(); }, f.ms);
}
window.__fx = fx;

  }

    if (G.result === 'win') fx('victory', art('h2', 'fxart') + '<div class="fxword">Escapaste de la isla</div><div class="fxsub big">' + score(G).total + ' puntos</div>', 3800);
    else fx('defeat', art('moribundo', 'fxart') + '<div class="fxword">La isla te venció</div><div class="fxsub">Llegaste a la etapa ' + STEPS[G.step].toLowerCase() + '.</div>', 3400);
  }
}
function doAct(a) {

}

    case 'skip': doAct({ t: 'skip' }); break;
    case 'pirate': doAct({ t: 'pirate', i: +v }); break;
    case 'draw': doAct({ t: 'draw' }); break;
    case 'end': sel = new Set(); doAct({ t: 'end' }); break;

    case 'giveup': if (armed === 'giveup') doAct({ t: 'giveup' }); else armed = 'giveup'; break;

        else {
          let used = destroyCost(entry(G, eid).c);
          for (const id of sel) used += destroyCost(entry(G, id).c);
          if (used <= G.pend.budget) sel.add(eid);

      if (G.phase === 'sort') sortUI = null;

    case 'dconfirm': doAct({ t: 'destroy', list: Array.from(sel) }); sel = new Set(); break;

      if (q >= 0 && q < o.length) { const t = o[p]; o[p] = o[q]; o[q] = t; }

document.addEventListener('click', ev => {

  if (!G) return;
  if (G.phase === 'choose' && (k === '1' || k === '2') && G.pair[+k - 1]) handle('pick', +k - 1);
  else if (G.phase === 'fight' && (k === ' ' || k.toLowerCase() === 'd')) { if (canDraw(G)) handle('draw'); }
  else if (G.phase === 'fight' && k === 'Enter') { if (evalFight(G).total >= targetOf(G)) handle('end'); }

  else if (G.phase === 'sort' && k === 'Enter') handle('sok');

window.addEventListener('pagehide', () => { if (G) persist(); });
window.__n = { G: () => G, view: () => view };
render();
})();
