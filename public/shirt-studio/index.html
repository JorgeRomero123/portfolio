<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shirt Studio">
<meta name="theme-color" content="#121315">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/Anton.woff2" as="font" type="font/woff2" crossorigin>
<title>Shirt Studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></symbol>
    <symbol id="i-shirt" viewBox="0 0 24 24"><path d="M8.5 3.5L3 6.5l2 5 3-1.2V21h8V10.3l3 1.2 2-5-5.5-3a3.5 3.5 0 01-7 0z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1.4-4.6L15.8 5a2.1 2.1 0 013 3L8.6 18.6 4 20z"/><path d="M13.8 7l3 3"/></symbol>
    <symbol id="i-ink" viewBox="0 0 24 24"><path d="M12 2.5l5.5 7.5L14 18h-4L6.5 10z"/><circle cx="12" cy="11" r="1.4"/><path d="M12 2.5V9.6"/><path d="M10 18v3.5h4V18"/></symbol>
    <symbol id="i-mono" viewBox="0 0 24 24"><path d="M9.5 2.5h5v7l1.8 3V16H7.7v-3.5l1.8-3z"/><path d="M11 16l.5 3h1l.5-3"/><path d="M12 19v2.5"/></symbol>
    <symbol id="i-marker" viewBox="0 0 24 24"><path d="M14.5 3.5l6 6-7.5 7.5H7v-6z"/><path d="M7 17l-3 3.5h6"/><path d="M11 7l6 6"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M8.5 20L4 15.5a2 2 0 010-2.8L12.7 4a2 2 0 012.8 0L20 8.5a2 2 0 010 2.8L11.3 20z"/><path d="M8.5 20H20"/><path d="M8.7 8l7.3 7.3"/></symbol>
    <symbol id="i-fill" viewBox="0 0 24 24"><path d="M4 12.3L10.8 5.5l6.8 6.8-6.8 6.8z"/><path d="M10.8 5.5L8.3 3"/><path d="M4 12.3h13.6"/><path d="M20 14.5s-1.6 2.1-1.6 3.3a1.6 1.6 0 003.2 0c0-1.2-1.6-3.3-1.6-3.3z"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 7V4.5h14V7"/><path d="M12 4.5v15"/><path d="M9 19.5h6"/></symbol>
    <symbol id="i-picker" viewBox="0 0 24 24"><path d="M14.5 5.5l4 4"/><path d="M17.3 3.2a2.1 2.1 0 013 3l-2.4 2.4-3-3z"/><path d="M15.5 6.8L6.2 16.1 5 19l2.9-1.2 9.3-9.3"/></symbol>
    <symbol id="i-sym" viewBox="0 0 24 24"><path d="M12 3v2M12 8v2M12 13v2M12 18v3"/><path d="M8.5 7L3.5 12l5 5z"/><path d="M15.5 7l5 5-5 5z"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3.5l8.5 4.7L12 13 3.5 8.2z"/><path d="M3.5 12.2L12 17l8.5-4.8"/><path d="M3.5 16.2L12 21l8.5-4.8"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
    <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M3.5 3.5l17 17"/><path d="M10.4 5.7A9.6 9.6 0 0112 5.5C18 5.5 21.5 12 21.5 12a17 17 0 01-2.9 3.7"/><path d="M6.4 6.9C3.9 8.6 2.5 12 2.5 12S6 18.5 12 18.5a9 9 0 004-.9"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/><path d="M15.5 8.5V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7.5a2 2 0 002 2h2.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  </defs>
</svg>

<!-- ============ GALLERY ============ -->
<main id="gallery" class="screen">
  <header class="g-head">
    <div>
      <h1>Shirt Studio</h1>
      <p class="g-sub" id="g-count"></p>
    </div>
    <button class="btn primary" id="g-new" type="button"><svg><use href="#i-plus"/></svg>New design</button>
  </header>
  <div class="g-scroll scroll">
    <div class="g-grid" id="g-grid"></div>
    <div class="g-empty" id="g-empty" hidden>
      <div class="g-empty-art"><svg><use href="#i-shirt"/></svg></div>
      <h2>Start your first design</h2>
      <p>Pick a print size. Everything saves on this iPad automatically.</p>
    </div>
    <p class="g-tip" id="g-tip"></p>
  </div>
</main>

<!-- ============ EDITOR ============ -->
<section id="editor" class="screen" hidden>
  <div id="stage">
    <div id="board">
      <div id="bg"></div>
      <svg id="guides" preserveAspectRatio="none"></svg>
    </div>
  </div>
  <div id="cursor"></div>
  <div id="loupe"><i></i></div>
  <div id="zoomlabel"></div>

  <div class="topbar">
    <div class="pill">
      <button class="ib" id="t-back" type="button" aria-label="Gallery"><svg><use href="#i-back"/></svg></button>
      <button class="title-btn" id="t-title" type="button"></button>
    </div>
    <div class="pill">
      <button class="chip" id="t-inks" type="button"></button>
      <button class="ib" id="t-shirt" type="button" aria-label="Preview on shirt"><svg><use href="#i-shirt"/></svg></button>
      <button class="ib" id="t-export" type="button" aria-label="Export"><svg><use href="#i-share"/></svg></button>
      <button class="ib" id="t-more" type="button" aria-label="More"><svg><use href="#i-more"/></svg></button>
    </div>
  </div>

  <div class="rail pill" id="rail">
    <div class="vslider" id="s-size" aria-label="Brush size"><i class="fill"></i><i class="knob"></i></div>
    <div class="readout" id="r-size"></div>
    <div class="vslider short" id="s-opacity" aria-label="Opacity"><i class="fill"></i><i class="knob"></i></div>
    <div class="readout" id="r-opacity"></div>
    <div class="rail-sep"></div>
    <button class="ib" id="t-undo" type="button" aria-label="Undo"><svg><use href="#i-undo"/></svg></button>
    <button class="ib" id="t-redo" type="button" aria-label="Redo"><svg><use href="#i-redo"/></svg></button>
  </div>

  <nav class="dock pill" id="dock">
    <button class="ib tool" data-tool="pencil" type="button" aria-label="Pencil"><svg><use href="#i-pencil"/></svg></button>
    <button class="ib tool" data-tool="ink" type="button" aria-label="Ink"><svg><use href="#i-ink"/></svg></button>
    <button class="ib tool" data-tool="mono" type="button" aria-label="Mono pen"><svg><use href="#i-mono"/></svg></button>
    <button class="ib tool" data-tool="marker" type="button" aria-label="Marker"><svg><use href="#i-marker"/></svg></button>
    <span class="sep"></span>
    <button class="ib tool" data-tool="eraser" type="button" aria-label="Eraser"><svg><use href="#i-eraser"/></svg></button>
    <button class="ib tool" data-tool="fill" type="button" aria-label="Fill"><svg><use href="#i-fill"/></svg></button>
    <button class="ib tool" data-tool="text" type="button" aria-label="Text"><svg><use href="#i-text"/></svg></button>
    <button class="ib tool" data-tool="picker" type="button" aria-label="Eyedropper"><svg><use href="#i-picker"/></svg></button>
    <span class="sep"></span>
    <button class="ib" id="t-sym" type="button" aria-label="Mirror symmetry"><svg><use href="#i-sym"/></svg></button>
    <button class="ib" id="t-layers" type="button" aria-label="Layers"><svg><use href="#i-layers"/></svg><b class="badge" id="layer-badge"></b></button>
    <span class="sep"></span>
    <button class="swatch-btn" id="t-color" type="button" aria-label="Colour"><i></i></button>
  </nav>

  <div class="textbar pill" id="textbar" hidden>
    <button class="btn ghost" id="tx-edit" type="button">Edit</button>
    <span class="tx-label">Size</span>
    <div class="hslider" id="tx-size"><i class="fill"></i><i class="knob"></i></div>
    <button class="btn ghost" id="tx-cancel" type="button">Cancel</button>
    <button class="btn primary" id="tx-done" type="button">Place</button>
  </div>
</section>

<!-- ============ MOCKUP ============ -->
<section id="mockup" hidden>
  <div class="mk-top">
    <button class="ib" id="mk-close" type="button" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    <div class="mk-title">Shirt preview <span id="mk-size"></span></div>
    <button class="btn primary" id="mk-save" type="button">Save image</button>
  </div>
  <div class="mk-stage"><canvas id="mk-canvas"></canvas></div>
  <div class="mk-bottom">
    <div class="mk-chips" id="mk-chips"></div>
    <label class="mk-toggle"><input type="checkbox" id="mk-bgsync"> Use this colour behind the canvas while drawing</label>
  </div>
</section>

<div id="catcher" hidden></div>
<div id="pops"></div>
<div id="modals"></div>
<div id="toast" role="status"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
